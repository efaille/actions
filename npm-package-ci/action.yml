name: "NPM package CI"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v3
    - name: Build NPM package
      shell: bash
      run: npm ci
    - name: Run format:check script if present
      shell: bash
      run: npm run format:check
    - name: Run lint:check script if present
      shell: bash
      run: npm run lint:check
    - name: Run test script if present
      shell: bash
      run: npm run test --if-present
    - name: Run build script if present
      shell: bash
      run: npm run build --if-present
    - name: Prune NPM package
      shell: bash
      run: npm prune
