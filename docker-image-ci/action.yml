name: "Docker image CI"
inputs:
  registry:
    required: false
    default: ghcr.io
  username:
    required: true
  password:
    required: true
  tag:
    required: true
  context:
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v3
    - uses: docker/setup-qemu-action@v2
    - uses: docker/setup-buildx-action@v2
    - uses: docker/login-action@v2
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - name: Build Docker image
      shell: bash
      run: docker build ${{ inputs.context }} --tag ${{ inputs.registry }}/${{ inputs.tag }}
    - name: Run Docker Compose test file if present
      shell: bash
      run: docker compose ...
    - name: Push Docker image
      shell: bash
      run: docker push ${{ inputs.registry }}/${{ inputs.tag }}
